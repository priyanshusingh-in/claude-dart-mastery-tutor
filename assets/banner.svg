<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Dart Mastery Tutor</title>
  <desc id="d">Dart Mastery Tutor, a Claude skill for learning Dart. Dart logo beside the title and a short description.</desc>
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#0175C2" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0175C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1019"/>
      <stop offset="1" stop-color="#0D1828"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>

    <!-- Official Dart logo (dart.dev), 192x192 -->
    <g id="dart">
      <path fill="#01579B" d="M51,141l-26-26c-3.08-3.17-5-7.63-5-12c0-2.02,1.14-5.18,2-7l24-50L51,141z"/>
      <path fill="#40C4FF" d="M140,51l-26-26c-2.27-2.28-7-5-11-5c-3.44,0-6.81,0.69-9,2L46,46L140,51z"/>
      <polygon fill="#40C4FF" points="82,172 145,172 145,145 98,130 55,145"/>
      <path fill="#29B6F6" d="M46,127c0,8.02,1.01,9.99,5,14l4,4h90l-44-50L46,46V127z"/>
      <path fill="#01579B" d="M126,46H46l99,99h27V83l-32-32C135.51,46.49,131.51,46,126,46z"/>
      <path opacity="0.2" fill="#FFFFFF" d="M52,142c-4-4.02-5-7.97-5-15V47l-1-1v81C46,134.03,46,135.98,52,142l3,3l0,0L52,142z"/>
      <polygon opacity="0.2" fill="#263238" points="171,82 171,144 144,144 145,145 172,145 172,83"/>
      <path opacity="0.2" fill="#FFFFFF" d="M140,51c-4.96-4.96-9.02-5-15-5H46l1,1h78C127.99,47,135.52,46.5,140,51L140,51z"/>
    </g>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #8fa6bf; }
    .title   { font-size: 58px; font-weight: 700; letter-spacing: -1.2px; fill: #ffffff; }
    .tag     { font-size: 20px; font-weight: 400; fill: #9db4cc; }
    .pill    { font-size: 14px; font-weight: 600; fill: #cfe3f5; }
    .mark    { animation: drift 9s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(840px,6px) scale(1.55); } 50% { transform: translate(840px,-6px) scale(1.55); } }
    .dot     { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .mark, .dot { animation: none; } .mark { transform: translate(840px,0) scale(1.55); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <!-- watermark -->
    <g class="mark" opacity=".16"><use xlink:href="#dart" href="#dart"/></g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#9fd4f5" stroke-opacity=".14"/>

  <!-- lockup -->
  <g transform="translate(72,70) scale(0.5)"><use xlink:href="#dart" href="#dart"/></g>

  <circle class="dot" cx="196" cy="79" r="4" fill="#D97757"/>
  <text class="eyebrow" x="210" y="84">CLAUDE SKILL</text>
  <text class="title" x="190" y="146">Dart Mastery Tutor</text>

  <text class="tag" x="192" y="188">Diagnoses your level, teaches Dart 3, coaches DSA interviews,</text>
  <text class="tag" x="192" y="216">guides your first real project, and tracks a rating you earn.</text>

  <g transform="translate(192,242)">
    <rect width="86" height="34" rx="17" fill="none" stroke="#9fd4f5" stroke-opacity=".28"/>
    <text class="pill" x="43" y="22" text-anchor="middle">Dart 3</text>
    <rect x="98" width="150" height="34" rx="17" fill="none" stroke="#9fd4f5" stroke-opacity=".28"/>
    <text class="pill" x="173" y="22" text-anchor="middle">DSA + interviews</text>
    <rect x="260" width="196" height="34" rx="17" fill="none" stroke="#9fd4f5" stroke-opacity=".28"/>
    <text class="pill" x="358" y="22" text-anchor="middle">Flutter + backend + web</text>
  </g>
</svg>
