<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Dart Mastery Tutor</title>
  <desc id="d">Banner for Dart Mastery Tutor, a Claude skill for learning Dart. A sample Learner Card shows an overall rating and four skill areas.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#0175C2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0175C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#13B9FD" stop-opacity=".16"/>
      <stop offset="1" stop-color="#13B9FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.25" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#fade)"/></mask>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9fd4f5" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD1FF"/>
      <stop offset="1" stop-color="#13B9FD"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0175C2"/>
      <stop offset="1" stop-color="#4FD1FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14233a"/>
      <stop offset="1" stop-color="#0d1829"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #e9f4ff; }
    .title   { font-size: 62px; font-weight: 800; letter-spacing: -1.5px; fill: #ffffff; }
    .tag     { font-size: 22px; font-weight: 400; fill: #9db4cc; }
    .tag b   { font-weight: 600; fill: #e9f4ff; }
    .cmd     { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; font-size: 15px; font-weight: 500; fill: #7fd8ff; }
    .cap     { font-size: 11px; font-weight: 700; letter-spacing: 2.4px; fill: #6f8aa6; }
    .big     { font-size: 64px; font-weight: 800; letter-spacing: -2px; fill: #ffffff; }
    .of      { font-size: 20px; font-weight: 500; fill: #6f8aa6; }
    .sm      { font-size: 14px; font-weight: 400; fill: #9db4cc; }
    .lvl     { font-size: 13px; font-weight: 700; fill: #4FD1FF; }
    .row     { font-size: 14px; font-weight: 500; fill: #cfe3f5; }
    .val     { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .foot    { font-size: 12px; font-weight: 400; fill: #6f8aa6; }

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    .fill { transform-box: fill-box; transform-origin: left center; animation: grow 9s cubic-bezier(.22,.8,.3,1) infinite; }
    .f1 { animation-delay: 0s; } .f2 { animation-delay: .18s; } .f3 { animation-delay: .36s; } .f4 { animation-delay: .54s; }
    @keyframes grow { 0% { transform: scaleX(0); } 14%,86% { transform: scaleX(1); } 96%,100% { transform: scaleX(0); } }

    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      .pulse, .fill, .float { animation: none; }
    }
  </style>

  <!-- backdrop -->
  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="#08101b"/>
    <rect width="1200" height="400" fill="url(#glowB)"/>
    <rect width="1200" height="400" fill="url(#glowA)"/>
    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#9fd4f5" stroke-opacity=".14"/>

  <!-- left: message -->
  <g transform="translate(72,0)">
    <rect x="0" y="66" width="168" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <circle class="pulse" cx="20" cy="82" r="4.5" fill="#D97757"/>
    <text class="eyebrow" x="34" y="87">CLAUDE SKILL</text>

    <text class="title" x="0" y="172">Dart <tspan fill="url(#word)">Mastery</tspan> Tutor</text>

    <text class="tag" x="0" y="216"><tspan class="b" font-weight="600" fill="#e9f4ff">Diagnose</tspan> your level. <tspan font-weight="600" fill="#e9f4ff">Learn</tspan> Dart 3.</text>
    <text class="tag" x="0" y="248">Get <tspan font-weight="600" fill="#e9f4ff">reviewed</tspan>. Earn a rating you can trust.</text>

    <g transform="translate(0,282)">
      <rect width="86" height="36" rx="10" fill="#0175C2" fill-opacity=".16" stroke="#13B9FD" stroke-opacity=".35"/>
      <text class="cmd" x="43" y="23" text-anchor="middle">/review</text>
      <rect x="98" width="104" height="36" rx="10" fill="#0175C2" fill-opacity=".16" stroke="#13B9FD" stroke-opacity=".35"/>
      <text class="cmd" x="150" y="23" text-anchor="middle">/socratic</text>
      <rect x="214" width="92" height="36" rx="10" fill="#0175C2" fill-opacity=".16" stroke="#13B9FD" stroke-opacity=".35"/>
      <text class="cmd" x="260" y="23" text-anchor="middle">/sprint</text>
      <rect x="318" width="80" height="36" rx="10" fill="#0175C2" fill-opacity=".16" stroke="#13B9FD" stroke-opacity=".35"/>
      <text class="cmd" x="358" y="23" text-anchor="middle">/mock</text>
    </g>
  </g>

  <!-- right: Learner Card -->
  <g class="float">
    <g transform="translate(700,44)" filter="url(#shadow)">
      <rect width="428" height="312" rx="22" fill="url(#card)" stroke="#9fd4f5" stroke-opacity=".18"/>
    </g>
    <g transform="translate(700,44)">
      <text class="cap" x="28" y="38">LEARNER CARD</text>
      <rect x="296" y="20" width="104" height="26" rx="13" fill="#13B9FD" fill-opacity=".14" stroke="#13B9FD" stroke-opacity=".4"/>
      <text class="lvl" x="348" y="38" text-anchor="middle">Practitioner</text>

      <text class="big" x="26" y="112">54</text>
      <text class="of" x="104" y="112">/ 100</text>
      <text class="sm" x="28" y="136">Overall Dart rating</text>
      <line x1="28" y1="154" x2="400" y2="154" stroke="#9fd4f5" stroke-opacity=".12"/>

      <g transform="translate(0,170)">
        <text class="row" x="28" y="12">Syntax &amp; types</text>
        <rect x="190" y="2" width="170" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
        <rect class="fill f1" x="190" y="2" width="133" height="10" rx="5" fill="url(#bar)"/>
        <text class="val" x="400" y="12" text-anchor="end">78</text>

        <text class="row" x="28" y="40">Null safety</text>
        <rect x="190" y="30" width="170" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
        <rect class="fill f2" x="190" y="30" width="104" height="10" rx="5" fill="url(#bar)"/>
        <text class="val" x="400" y="40" text-anchor="end">61</text>

        <text class="row" x="28" y="68">Async &amp; streams</text>
        <rect x="190" y="58" width="170" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
        <rect class="fill f3" x="190" y="58" width="71" height="10" rx="5" fill="url(#bar)"/>
        <text class="val" x="400" y="68" text-anchor="end">42</text>

        <text class="row" x="28" y="96">Records &amp; patterns</text>
        <rect x="190" y="86" width="170" height="10" rx="5" fill="#ffffff" fill-opacity=".08"/>
        <rect class="fill f4" x="190" y="86" width="48" height="10" rx="5" fill="url(#bar)"/>
        <text class="val" x="400" y="96" text-anchor="end">28</text>
      </g>

      <text class="foot" x="28" y="296">Example card. Ratings are earned from evidence, never given.</text>
    </g>
  </g>
</svg>
